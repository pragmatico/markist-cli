run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - bodyclose
    - unconvert
    - revive

linters-settings:
  revive:
    rules:
      - name: exported
  gofmt:
    simplify: true
  misspell:
    locale: US

issues:
  exclude-dirs:
    - dist
    - dist-extra
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
