name: CLI Release

# Runs in the public pragmatico/markist-cli repo, which receives this folder
# from the private monorepo's sync workflow. The Go module lives at that
# repo's root, so a bare `vX.Y.Z` tag is both the Go module version
# (`go install github.com/pragmatico/markist-cli/cmd/markist@vX.Y.Z`) and the
# semver tag GoReleaser releases from -- no tag mirroring needed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
