# GoReleaser config for the Markist CLI.
#
# Runs in the public pragmatico/markist-cli mirror (see
# .github/workflows/cli-release.yml), where the Go module lives at the repo
# root. A bare `vX.Y.Z` tag there is both the Go module version and the semver
# tag GoReleaser releases from.
version: 2

project_name: markist-cli

before:
  hooks:
    - go mod tidy
    - sh -c 'mkdir -p dist-extra/completions dist-extra/man'
    - sh -c 'go run ./cmd/markist completion bash > dist-extra/completions/markist.bash'
    - sh -c 'go run ./cmd/markist completion zsh > dist-extra/completions/markist.zsh'
    - sh -c 'go run ./cmd/markist completion fish > dist-extra/completions/markist.fish'
    - sh -c 'go run ./cmd/markist man --dir dist-extra/man'

builds:
  - id: markist
    main: ./cmd/markist
    binary: markist
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/pragmatico/markist-cli/internal/version.Version={{ .Version }}
      - -X github.com/pragmatico/markist-cli/internal/version.Commit={{ .Commit }}
      - -X github.com/pragmatico/markist-cli/internal/version.Date={{ .Date }}

archives:
  - id: markist
    ids:
      - markist
    name_template: >-
      markist-cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README.md
      - src: dist-extra/completions/*
        dst: completions
      - src: dist-extra/man/*
        dst: man

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc

# Homebrew via homebrew_casks (`brews` is deprecated in GoReleaser >= 2.10).
# Binaries are unsigned, so the cask needs a postflight hook that strips the
# quarantine attribute -- otherwise Gatekeeper blocks the first run.
homebrew_casks:
  - name: markist-cli
    repository:
      owner: pragmatico
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://markist.xyz"
    description: "Markist CLI -- bookmarks and prompts from your terminal"
    binaries:
      - markist
    completions:
      bash: completions/markist.bash
      zsh: completions/markist.zsh
      fish: completions/markist.fish
    manpages:
      - man/markist.1
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/markist"]
          end

release:
  name_template: "markist-cli {{ .Version }}"
